title: Data 101 / CS 187
tagline: Data Engineering
description: Data Engineering
author: Data 101 Course Staff
url: 'https://data101.org' 
baseurl: '/fa26' 
current_week: 1

# Course variables
course: DATA 101
course_email: data101@berkeley.edu
course_department: dsus
gradescope_course_id: 1370373
bcourses_course_id: 1557891
ed_course_id: 102212
semester: fa26
logo: assets/images/data101.png
class_archive_path: /

# auxiliary links show up on the top right
aux_links:
  Course Notes: https://data101.org/notes
  DataHub: https://data101.datahub.berkeley.edu
  # Additional Extensions: "https://docs.google.com/forms/d/e/1FAIpQLSeWYakKx_K7wFvlpzDAEeYxqFrWWnNwh4L1cI-oxsYoEMoUyw/viewform?usp=dialog"

# nav external links show up in left hand navigation
nav_external_links:
  - title: ⚙️ Course FAQ
    url: https://data101.org/faqs/fa26
    hide_icon: true
  - title: 📖 Course Notes
    url: https://data101.org/notes
    hide_icon: true

color_scheme: light
berkeley_theme_options:
  show_logo_in_sidebar: true

google_calendar:
  # This can be found in the settings for the calendar.
  # The calendar must be publicly readable.
  google_calendar_id: data101@berkeley.edu
  # You need to make this, once per course, ideally via a SPA
  # https://console.cloud.google.com/apis/api/calendar-json.googleapis.com/metrics?authuser=2&project=data101-website
  google_api_key: AIzaSyD1Tw4oJZfxn7RvCEkubEspj2dsmD033Uw
  # These are processed in order, top-to-bottom, first match apploes
  # The prefix/suffix matches the Google Calendar event *title*
  # You may use only prefix OR suffix, see calendar.js
  event_types:
    # Staff office hours and discussions are titled "[OH] Name" /
    # "[Discussion] Name" on the course calendar, so they match on prefix.
    - prefix: '[OH]'
      background_color: 'D9CEFF' # purple light
      text_color: '000000'
      class: cal-oh
      icon: fa-person-circle-question
    - prefix: '[Discussion]'
      background_color: '004AAE' # blue medium
      text_color: 'FFFFFF'
      class: cal-disc-section
      icon: fa-person-chalkboard
    - suffix: Lecture
      background_color: '9FD1FF' # Blue light
      text_color: '000'
      class: cal-lecture
      icon: fa-school
    - suffix: Tea Hours
      background_color: 'FFE88D' # gold light
      text_color: '000'
      class: cal-tea-oh
      icon: fa-mug-hot
    - suffix: Section
      background_color: '004AAE' # blue medium
      text_color: 'FFFFFF'
      class: cal-disc-section
      icon: fa-person-chalkboard
    - suffix: Faculty Office Hours
      background_color: 'FFC31B' # gold medium
      text_color: '000'
      class: cal-tea-oh
      icon: fa-person-circle-question
    - suffix: Office Hours
      background_color: 'D9CEFF' # purple light
      text_color: '000000'
      class: cal-oh
      icon: fa-person-circle-question
    - suffix: Tutoring Section(s)
      background_color: 'FFCFE5' # rose light
      text_color: '000000'
      class: cal-tutoring
      icon: fa-people-group
    - suffix: Exam
      background_color: 'FA8072' # salmon red
      text_color: '000000'
      class: cal-tutoring
      icon: fa-school

# Collections for website data
collections:
  staffers:
    sort_by: name
  calendars:
  announcements:
  labs:
    output: true
    permalink: /:collection/:path/
  lectures:
    output: true
    sort_by: number # Date could work...
    permalink: /lectures/:path/
  hw:
    output: true
    permalink: /:collection/:path/
  projects:
    output: true
    permalink: /:collection/:path/
  discussions:
    output: true
    permalink: /:collection/:path/

# The sitemap **must** be enabled. It's published as /baseurl/sitemap.xml
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-github-metadata
  - jekyll-include-cache
  - jekyll-jupyter-notebook

# Default layouts for each collection type
defaults:
  - scope:
      path: ''
      type: labs
    values:
      layout: lab
      nav_exclude: true
  - scope:
      path: ''
      type: discussions
    values:
      layout: discussion
      nav_exclude: true
      subpath: 'assets/discussions/'
  - scope:
      path: ''
      type: hw
    values:
      layout: hw
      nav_exclude: true
  - scope:
      path: ''
      type: projects
    values:
      layout: project
      nav_exclude: true
  - scope:
      path: '_staffers'
      type: staffers
    values:
      layout: staffer
      height: 300
      subpath: '/assets/images/staff/'
      width: 300
  - scope:
      path: ''
      type: calendars
    values:
      layout: calendar
  - scope:
      path: ''
      type: announcements
    values:
      layout: announcement
  - scope:
      path: ''
      type: lectures
    values:
      layout: lecture
      time: 00:00 # Default release time of lectures is currently set to 12:00 AM


######################################################################
# Just the Docs / Berkeley Class Site Common Config
# Options below here will likely not need to be configured..
######################################################################
# TODO(template): We should clean these up + standardize...
# TODO(setup): You may want to add additional
callouts_level: quiet # or loud
callouts:
  highlight:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

# TODO(template): CSS compilations. Handle warnings...
sass:
  style: expanded
  sass_dir: _sass
  sourcemap: always
  quiet_deps: true
  verbose: false
  silence_deprecations: ["import"]

# Theme settings
theme: just-the-docs
search_enabled: true
heading_anchors: true
permalink: pretty

## Footer Content.
# You should probably not change these, but may add to footer_content if necessary.
# Replace `true` with any additional HTML that you would like to add.
# Footer *must* included the accessibility text defined in footer_custom.html
footer_content: true
back_to_top: true
back_to_top_text: "Back to Top"
last_edit_timestamp: true
last_edit_time_format: '%m %d, %Y at %H:%M'

# Compilation settings used by compress-html plugin:
# https://github.com/penibelst/jekyll-compress-html/tree/v3.2.0?tab=readme-ov-file
compress_html:
  clippings: all
  comments: all
  endings: all
  startings: []
  blanklines: false
  profile: false

# Native Jeykll build options
# You likely shouldn't need to touch these, but they are documented here just in case.
# https://jekyllrb.com/docs/configuration/options/

# This makes it easier when pushing to a static directory.
# The default false removes files in that directory, which is useful for when you unpublish pages.
# keep_files: false

# Set the timezone to ensure days appear correctly on the auto-generated schedule
# This fixed one-off problems with extra days (extra_days_col2) defined in _data/syllabus.yml
timezone: UTC
future: true

# Note: dotfiles are excluded by default. .htaccess is included as a common case.
include:
  - LICENSE
  - .htaccess
  - robots.txt

exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - vendor/
  - README.md
  - CONTRIBUTING.md
  - tmp/
  - script/
  - spec/
  - node_modules/
